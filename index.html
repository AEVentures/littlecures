<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e1b4b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>LittleCures — Open infrastructure for pediatric cancer</title>
    <meta
      name="description"
      content="LittleCures is an open-source, patient-first project accelerating cures for children with cancer. Trial matching, federated learning across hospitals, and an open target and IP registry."
    />
    <link rel="canonical" href="https://littlecures.org/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LittleCures" />
    <meta property="og:title" content="LittleCures — Open infrastructure for pediatric cancer" />
    <meta
      property="og:description"
      content="Open-source infrastructure to accelerate cures for children with cancer. Trial matching, federated learning, and an open target registry."
    />
    <meta property="og:url" content="https://littlecures.org/" />
    <meta property="og:image" content="https://littlecures.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LittleCures — Open infrastructure for pediatric cancer" />
    <meta
      name="twitter:description"
      content="Open-source infrastructure to accelerate cures for children with cancer."
    />
    <meta name="twitter:image" content="https://littlecures.org/og-image.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "LittleCures",
        "url": "https://littlecures.org/",
        "description": "Open-source infrastructure to accelerate cures for children with cancer.",
        "sameAs": ["https://github.com/AEVentures/littlecures"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
